# Public Python package release — https://github.com/xgic/ai/blob/main/docs/python-package-release.md
# Auth: OIDC Trusted Publishing only (no long-lived PyPI tokens).
# Tags: vX.Y.ZrcN → TestPyPI; vX.Y.Z (no rc) → PyPI.
# Final tags are blocked unless a matching RC tag (vX.Y.ZrcN) already exists.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Assert pyproject version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VER="${TAG#v}"
          PY_VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${PY_VER}" != "${TAG_VER}" ]; then
            echo "::error::pyproject.toml version (${PY_VER}) must match tag version (${TAG_VER})"
            exit 1
          fi
          echo "Version OK: ${PY_VER}"

      - name: Build
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # Final (non-rc) tags must follow RC → TestPyPI → smoke before PyPI.
  # See docs/RELEASE.md and hub python-package-release.md §7–8.
  require-prior-rc:
    name: Require prior RC tag (final only)
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if no vX.Y.ZrcN tag exists for this final version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          VER="${TAG#v}"
          # Match v0.1.3rc1, v0.1.3rc2, ... (not v0.1.30rc1)
          mapfile -t RC_TAGS < <(git tag -l "v${VER}rc*" | sort -V)
          if [ "${#RC_TAGS[@]}" -eq 0 ]; then
            echo "::error::Final tag ${TAG} is not allowed without a prior RC tag."
            echo "XGIC standard: bump to ${VER}rc1 → tag v${VER}rc1 → TestPyPI smoke + GitHub prerelease,"
            echo "then bump to ${VER} → tag v${VER} → PyPI."
            echo "See https://github.com/xgic/ai/blob/main/docs/python-package-release.md and docs/RELEASE.md"
            exit 1
          fi
          echo "Prior RC tag(s) found for ${VER}:"
          printf '  %s\n' "${RC_TAGS[@]}"

  publish-testpypi:
    name: Publish to TestPyPI
    if: contains(github.ref_name, 'rc')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/xgic-gitlab-graphql/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  smoke-testpypi:
    name: Smoke install (TestPyPI)
    if: contains(github.ref_name, 'rc')
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install from TestPyPI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          uv venv .venv-smoke
          source .venv-smoke/bin/activate
          uv pip install --upgrade pip
          # TestPyPI first; PyPI for deps. unsafe-best-match + prerelease so RC
          # versions resolve when the package already exists on production PyPI.
          for i in 1 2 3 4 5 6; do
            uv pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              --prerelease allow \
              "xgic-gitlab-graphql==${VER}" && break
            sleep 15
          done
          python -c "from xgic.gitlab.graphql import GitLabClient, GitLabConfig; print(GitLabClient, GitLabConfig)"

  publish-pypi:
    name: Publish to PyPI
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: [build, require-prior-rc]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xgic-gitlab-graphql/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  smoke-pypi:
    name: Smoke install (PyPI)
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install from PyPI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          uv venv .venv-smoke
          source .venv-smoke/bin/activate
          uv pip install --upgrade pip
          for i in 1 2 3 4 5; do
            uv pip install "xgic-gitlab-graphql==${VER}" && break
            sleep 15
          done
          python -c "from xgic.gitlab.graphql import GitLabClient, GitLabConfig; print(GitLabClient, GitLabConfig)"

  github-release-rc:
    name: GitHub Release (RC)
    if: contains(github.ref_name, 'rc')
    needs: [smoke-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true

  github-release-final:
    name: GitHub Release (final)
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: [smoke-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
